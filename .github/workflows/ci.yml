# 가벼운 CI: main 푸시·PR 마다 CAT 패널과 포크 업데이터 설정 테스트만 macOS 에서 돌린다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: CAT 패널 테스트
        run: cargo test --locked -p photocraft-ui-egui --lib "cat::"
      - name: 업데이터 설정 테스트
        run: cargo test --locked -p photocraft-ui-egui --lib update_app_tests
