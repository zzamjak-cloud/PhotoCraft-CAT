# PhotoCAT 릴리스: 태그 vX.Y.Z 를 푸시하거나 수동 실행하면 macOS(Apple Silicon)·Windows(x64)
# 빌드를 만들어 GitHub 릴리스에 올린다. 앱의 업데이터(craft-update)는 이 저장소의 릴리스만 읽는다.
#
# 에셋 이름 규칙 (craft-update: <id>-<버전>-<os>-<arch>[-portable].<ext>, 체크섬은 SHA256SUMS.txt):
#   photocraft-cat-X.Y.Z-macos-aarch64.dmg             설치용
#   photocraft-cat-X.Y.Z-macos-aarch64.tar.gz          macOS 자체 업데이트용
#   photocraft-cat-X.Y.Z-windows-x64-setup.exe         설치·Windows 자체 업데이트용
#   photocraft-cat-X.Y.Z-windows-x64-setup.exe.sig     설치 프로그램의 Ed25519 서명 (64바이트, 앱의 win_update 가 확인)
#   photocraft-cat-X.Y.Z-windows-x64-portable.zip      v0.19.10 이하 앱의 자체 업데이트 전용 (받은 뒤 설치형으로 전환)
#   photocraft-cat-X.Y.Z-windows-x64-portable.zip.sig  zip 의 Ed25519 서명
#   SHA256SUMS.txt
#
# Windows 자체 업데이트 서명 키: GitHub Secret UPDATE_SIGNING_KEY (Ed25519 PEM 개인키).
# 공개키는 crates/ui-egui/src/win_update.rs 의 PUBLIC_KEY. 키가 없으면 릴리스를 만들지 않는다.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 X.Y.Z (태그 vX.Y.Z 를 현재 커밋에 만든다)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 공식 릴리스가 쓰던 craft-fonts 고정 커밋 (기존 release.yml 의 craft-fonts-ref).
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            v="${INPUT_VERSION#v}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          # craft-update 는 사전 릴리스 꼬리표가 붙은 버전을 제안하지 않으므로 X.Y.Z 만 허용한다.
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::버전은 X.Y.Z 형식이어야 한다 (받은 값: '$v')"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-15
    env:
      PHOTOCRAFT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
      - name: Build and package
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/macos/package-cat.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/release/*.dmg
            dist/release/*.tar.gz
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build and package
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
        run: ./packaging/windows/package-cat.ps1 -Version "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/release/*.zip
            dist/release/*-setup.exe
          if-no-files-found: error

  release:
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign Windows update (Ed25519)
        working-directory: dist
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY 시크릿이 없다 (Windows 자체 업데이트 서명 키)"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/update-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" >"$key"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/update-key.pub.pem"
          for z in *-windows-x64-portable.zip *-windows-x64-setup.exe; do
            openssl pkeyutl -sign -rawin -inkey "$key" -in "$z" -out "$z.sig"
            test "$(stat -c %s "$z.sig")" = 64
            openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/update-key.pub.pem" -in "$z" -sigfile "$z.sig"
          done
          rm -f "$key"
          # 앱에 넣은 공개키와 같은 키인지 확인한다.
          openssl pkey -pubin -in "$RUNNER_TEMP/update-key.pub.pem" -outform DER | tail -c 32 | xxd -p -c 64
      - name: SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum -- * >SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PhotoCAT v${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
